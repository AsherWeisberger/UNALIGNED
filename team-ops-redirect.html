<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>UNALIGNED · Opening dashboard</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 500 15px/1.5 system-ui, sans-serif;
      color: #e4e4e7;
      background: #09090b;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      padding: 22px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(18, 18, 22, 0.96);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: #a1a1aa; }
    a { color: #93c5fd; word-break: break-all; }
    .links { display: grid; gap: 8px; margin-top: 16px; }
    .btn {
      display: block;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(147, 197, 253, 0.35);
      background: rgba(30, 58, 138, 0.35);
      color: #dbeafe;
      text-decoration: none;
      font-weight: 600;
    }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Opening UNALIGNED dashboard…</h1>
    <p id="status">Checking Mac Studio connection.</p>
    <div class="links" id="links" hidden>
      <a class="btn" id="mac-link" href="#">Open Mac Studio dashboard</a>
      <a class="btn" id="local-link" href="http://127.0.0.1:8767/ops.html">On this Mac: localhost</a>
    </div>
    <p id="hint" style="font-size:12px;opacity:.7;margin-top:14px"></p>
  </div>
  <script>
  (function () {
    var MAC = 'https://mac-studio.tail50d3a2.ts.net';
    var target = MAC + '/ops.html' + location.search + location.hash;
    var host = String(location.hostname || '').toLowerCase();
    var onMac = host === '127.0.0.1' || host === 'localhost' || host.indexOf('mac-studio.tail') >= 0;

    var title = document.getElementById('title');
    var status = document.getElementById('status');
    var links = document.getElementById('links');
    var macLink = document.getElementById('mac-link');
    var hint = document.getElementById('hint');

    macLink.href = target;

    if (onMac) {
      location.replace('http://127.0.0.1:8767/ops.html' + location.search + location.hash);
      return;
    }

    function showError(msg) {
      title.textContent = 'Could not reach Mac Studio';
      status.innerHTML = '<span class="err">' + msg + '</span>';
      links.hidden = false;
      hint.textContent = 'ERR_NAME_NOT_RESOLVED means your network cannot resolve the Mac Studio hostname. Use localhost when on the Mac, or ensure Tailscale Funnel is on.';
    }

    fetch(MAC + '/health', { mode: 'cors', cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('Mac Studio returned ' + res.status);
        location.replace(target);
      })
      .catch(function () {
        showError('Mac Studio URL did not respond. Tap a link below.');
        links.hidden = false;
        setTimeout(function () {
          try { location.replace(target); } catch (e) {}
        }, 1200);
      });
  })();
  </script>
</body>
</html>
