<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UNALIGNED</title>
<script>
// agentdashboard.cloud = public forms only (never ops, never Mac URL).
// github.io legacy → Mac ops host unless ?stay=github (then ops.html).
(function () {
  var MAC_OPS = 'https://mac-studio.tail50d3a2.ts.net';
  var PUBLIC = {
    '/connect.html': 1, '/feedback.html': 1, '/scope.html': 1,
    '/connect': 1, '/feedback': 1, '/scope': 1, '/reach': 1
  };
  function norm(path) {
    var p = String(path || '/').replace(/^\/UNALIGNED\/?/i, '/').toLowerCase();
    if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1);
    return p || '/';
  }
  function isPublic(path) { return !!PUBLIC[norm(path)]; }
  var host = String(location.hostname || '').toLowerCase();
  var isCustom = host === 'agentdashboard.cloud' || host === 'www.agentdashboard.cloud';
  var isGithub = host === 'asherweisberger.github.io';
  var stayGithub = /[?&]stay=github(?:&|$)/.test(location.search);

  if (isCustom) {
    if (!isPublic(location.pathname)) {
      location.replace('/connect/' + location.search + location.hash);
    }
    return;
  }
  if (isGithub && !stayGithub && !isPublic(location.pathname)) {
    var path = String(location.pathname || '/').replace(/^\/UNALIGNED\/?/i, '/') || '/';
    location.replace(MAC_OPS + path + location.search + location.hash);
    return;
  }
  var prefix = isGithub ? '/UNALIGNED' : '';
  location.replace(prefix + '/ops.html' + location.search + location.hash);
})();
</script>
</head>
<body>
<p style="margin:0;padding:24px;font:500 15px/1.5 system-ui,sans-serif;color:#5a6272">Redirecting…</p>
</body>
</html>
