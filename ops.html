<script>
// Ops shell must not run on the public custom domain (or github.io without ?stay=github).
(function () {
  var host = String(location.hostname || '').toLowerCase();
  var isCustom = host === 'agentdashboard.cloud' || host === 'www.agentdashboard.cloud';
  if (isCustom) {
    location.replace('/connect/' + location.search + location.hash);
    return;
  }
  if (host === 'asherweisberger.github.io' && !/[?&]stay=github(?:&|$)/.test(location.search)) {
    var path = String(location.pathname || '/').replace(/^\/UNALIGNED\/?/i, '/') || '/';
    location.replace('https://mac-studio.tail50d3a2.ts.net' + path + location.search + location.hash);
  }
})();
</script>
<script>
// Preload send token from the Mac before React boots — no paste prompt on Approve & send.
(function () {
  var KEY = 'v4_api_token';
  try { if (localStorage.getItem(KEY)) return; } catch (e) {}
  var host = String(location.hostname || '').toLowerCase();
  var onPages = host === 'asherweisberger.github.io' || host === 'agentdashboard.cloud' || host === 'www.agentdashboard.cloud';
  if (onPages && !/[?&]stay=github(?:&|$)/.test(location.search)) return;
  var bases = [location.origin, 'https://mac-studio.tail50d3a2.ts.net', 'http://127.0.0.1:8767'];
  var seen = {};
  function tryNext(i) {
    if (i >= bases.length) return;
    var base = String(bases[i] || '').replace(/\/$/, '');
    if (!base || seen[base]) return tryNext(i + 1);
    seen[base] = 1;
    fetch(base + '/send-email-token', { method: 'GET', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var t = d && d.token ? String(d.token).trim() : '';
        if (t) { try { localStorage.setItem(KEY, t); } catch (e) {} return; }
        tryNext(i + 1);
      })
      .catch(function () { tryNext(i + 1); });
  }
  tryNext(0);
})();
</script>

<script>
(() => {
  const bootState = { errors: [] };
  const bootEl = document.getElementById('boot-status');
  const showBootMessage = (message) => {
    if (!bootEl) return;
    bootEl.style.display = 'block';
    bootEl.textContent = message;
  };

  window.__alignedBootOk = false;
  window.__alignedBootMarkReady = () => {
    window.__alignedBootOk = true;
    if (bootEl) bootEl.style.display = 'none';
  };

  window.addEventListener('error', (event) => {
    const msg = event?.message || 'Unknown startup error';
    const src = event?.filename ? '\n' + event.filename : '';
    const line = event?.lineno ? ':' + event.lineno : '';
    const col = event?.colno ? ':' + event.colno : '';
    const detail = event?.error?.stack || '';
    const detailText = msg + src + line + col + (detail ? '\n' + detail : '');
    if (window.__alignedBootOk) {
      console.error('[UNALIGNED runtime error]', detailText);
      return;
    }
    bootState.errors.push(detailText);
    showBootMessage('UNALIGNED dashboard hit a startup error.\n\n' + bootState.errors.join('\n\n'));
  });

  window.addEventListener('unhandledrejection', (event) => {
    const reason = event?.reason;
    const msg = typeof reason === 'string'
      ? reason
      : (reason && reason.message) || 'Unhandled promise rejection';
    if (window.__alignedBootOk) {
      console.error('[UNALIGNED runtime rejection]', msg, reason);
      return;
    }
    bootState.errors.push(msg);
    showBootMessage('UNALIGNED dashboard hit a startup error.\n\n' + bootState.errors.join('\n\n'));
  });

  const bootIsTouch = typeof window !== 'undefined' && (
    ('ontouchstart' in window) || (navigator.maxTouchPoints > 0)
  );
  const bootUsesBabel = /[?&]dev=1(?:&|$)/.test(String(location.search || ''));
  const bootTimeoutMs = bootUsesBabel ? (bootIsTouch ? 120000 : 45000) : (bootIsTouch ? 45000 : 20000);

  if (bootIsTouch && bootUsesBabel) {
    window.setTimeout(() => {
      if (!window.__alignedBootOk && !(bootState.errors || []).length) {
        showBootMessage('Loading on tablet…\n\nFirst visit compiles the dashboard in Safari (can take 1–2 minutes). Keep this tab open.\n\nTip: reload without ?dev=1 to use the precompiled bundle (much faster).');
      }
    }, 8000);
  }

  window.setTimeout(() => {
    if (!window.__alignedBootOk && !(bootState.errors || []).length) {
      const hint = bootUsesBabel
        ? 'Babel is still compiling the dashboard in your browser. Hard refresh and wait, or open without ?dev=1 for the fast bundle.'
        : 'Check your connection to the Mac Studio (Tailscale Funnel must be on). Try agentdashboard.cloud/ops';
      showBootMessage('UNALIGNED dashboard did not finish loading.\n\n' + hint);
    }
  }, bootTimeoutMs);
})();
</script>

<script>
// Local Qwen on Mac Studio — same-origin on mac-studio.tail; localhost uses direct bridge.
(function () {
  const TAILSCALE_BASE = 'https://mac-studio.tail50d3a2.ts.net';
  const LOCAL_BRIDGE = 'http://127.0.0.1:8787';
  const LOCAL_BRIEF = 'http://127.0.0.1:8767';
  const LLM_TIMEOUT_MS = 120000;

  function isLocalPage() {
    const host = String(window.location.hostname || '');
    return window.location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1';
  }

  function isMachineHosted() {
    return String(window.location.hostname || '').includes('mac-studio.tail');
  }

  function bridgeCandidates() {
    if (window.__LOCAL_LLM_BRIDGE__) return [window.__LOCAL_LLM_BRIDGE__];
    if (isMachineHosted()) return [window.location.origin];
    if (!isLocalPage()) return [TAILSCALE_BASE];
    return [LOCAL_BRIDGE, LOCAL_BRIEF, TAILSCALE_BASE];
  }

  async function fetchWithTimeout(url, options) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), LLM_TIMEOUT_MS);
    try {
      return await fetch(url, { ...options, signal: ctrl.signal });
    } catch (err) {
      if (err && err.name === 'AbortError') {
        throw new Error('Timed out after ' + Math.round(LLM_TIMEOUT_MS / 1000) + 's. Qwen may still be running — try again.');
      }
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  async function bridgeFetch(path, options) {
    const candidates = bridgeCandidates();
    let lastErr = null;
    for (const base of candidates) {
      const url = base + path;
      try {
        const sameOrigin = isMachineHosted() && base === window.location.origin;
        const resp = await fetchWithTimeout(url, {
          ...options,
          mode: sameOrigin ? 'same-origin' : 'cors',
          credentials: 'omit',
        });
        window.claude.activeBase = base;
        return { resp, base };
      } catch (err) {
        lastErr = err;
        console.warn('[local-llm] fetch failed for', url, err && err.message ? err.message : err);
      }
    }
    const target = candidates[0] || TAILSCALE_BASE;
    const hint = isMachineHosted()
      ? 'Mac Studio LLM unreachable at ' + target + path + '. Keep Ollama running and the brief service on port 8767.'
      : isLocalPage()
        ? 'Start scripts/active/local_llm_bridge.py or the brief server on this Mac.'
        : 'Open https://agentdashboard.cloud/ops for Draft with AI.';
    const detail = lastErr && lastErr.message ? ' (' + lastErr.message + ')' : '';
    throw new Error(hint + detail);
  }

  window.claude = {
    activeBase: null,
    bridgeCandidates,
    label() {
      if (isMachineHosted()) return 'Mac Studio';
      const base = window.claude.activeBase || bridgeCandidates()[0] || '';
      if (base.includes('mac-studio')) return 'Mac Studio';
      if (base.includes('127.0.0.1') || base.includes('localhost')) return 'This Mac';
      return 'Local LLM';
    },
    async complete(prompt, options) {
      const { resp, base } = await bridgeFetch('/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: String(prompt || ''),
          max_tokens: (options && options.max_tokens) || 800,
          num_ctx: options && options.num_ctx,
        }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.error || data.message || ('Local LLM failed (' + resp.status + ')'));
      }
      return String(data.text || '').trim();
    },
    async health() {
      try {
        const { resp } = await bridgeFetch('/llm-health', { method: 'GET' });
        if (resp.ok) return resp.json();
        const fallback = await bridgeFetch('/health', { method: 'GET' });
        return fallback.resp.ok ? fallback.resp.json() : null;
      } catch (err) {
        return null;
      }
    },
  };
})();
</script>

<script>
(function () {
  var OPS_GATE_STORAGE = 'ua_ops_gate_v1';
  var OPS_GATE_PASSWORD = 'Annika';
  var gateScreen = document.getElementById('ops-gate-screen');
  var gateForm = document.getElementById('ops-gate-form');
  var gateInput = document.getElementById('ops-gate-password');
  var gateError = document.getElementById('ops-gate-error');
  var bundleStarted = false;

  function opsGateUnlocked() {
    try { return sessionStorage.getItem(OPS_GATE_STORAGE) === '1'; } catch (e) { return false; }
  }

  function setOpsGateUnlocked() {
    try { sessionStorage.setItem(OPS_GATE_STORAGE, '1'); } catch (e) {}
  }

  function hideOpsGate() {
    document.body.classList.remove('ops-gate-locked');
    if (gateScreen) {
      gateScreen.classList.remove('is-visible');
      gateScreen.setAttribute('aria-hidden', 'true');
    }
  }

  function loadOpsBundle() {
    if (bundleStarted) return;
    bundleStarted = true;
    var cube = document.createElement('script');
    cube.src = 'flow-v4/cube-theme-transition.js?v=20260701-liquid-1';
    document.body.appendChild(cube);
    var dev = /[?&]dev=1(?:&|$)/.test(String(location.search || ''));
    var v = '20260708-active-x-v1';
    if (dev) {
      var babel = document.createElement('script');
      babel.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
      babel.crossOrigin = 'anonymous';
      babel.onload = function () {
        var s = document.createElement('script');
        s.type = 'text/babel';
        s.src = 'flow-v4/app-bundle.jsx?v=' + v;
        document.body.appendChild(s);
      };
      document.body.appendChild(babel);
      return;
    }
    var s = document.createElement('script');
    s.src = 'flow-v4/app-bundle.js?v=' + v;
    s.onerror = function () {
      var fallback = document.createElement('script');
      fallback.type = 'text/babel';
      fallback.src = 'flow-v4/app-bundle.jsx?v=' + v;
      var babel = document.createElement('script');
      babel.src = 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
      babel.crossOrigin = 'anonymous';
      babel.onload = function () { document.body.appendChild(fallback); };
      document.body.appendChild(babel);
    };
    document.body.appendChild(s);
  }

  function unlockOpsDashboard() {
    hideOpsGate();
    loadOpsBundle();
  }

  if (opsGateUnlocked()) {
    unlockOpsDashboard();
  } else if (gateForm && gateInput) {
    gateForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (gateError) gateError.textContent = '';
      var value = String(gateInput.value || '').trim();
      if (value !== OPS_GATE_PASSWORD) {
        if (gateError) gateError.textContent = 'Wrong password.';
        gateInput.value = '';
        gateInput.focus();
        return;
      }
      setOpsGateUnlocked();
      unlockOpsDashboard();
    });
    window.requestAnimationFrame(function () { gateInput.focus(); });
  }
})();
</script>
