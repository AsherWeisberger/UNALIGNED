<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNALIGNED · Partner feedback</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #fff;
      --text: #141820;
      --muted: #5c6475;
      --line: #e4dfd6;
      --accent: #2f5fd6;
      --accent-soft: #e8efff;
      --good: #15803d;
      --radius: 16px;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #dfe9ff 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #fde7f2 0%, transparent 50%),
        var(--bg);
      padding: 28px 16px 48px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
    }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #2f5fd6, #7c3aed);
      color: #fff; display: grid; place-items: center;
      font: 700 14px/1 var(--mono); letter-spacing: .08em;
    }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; }
    .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: 0 18px 40px rgba(20, 24, 32, .06);
    }
    .eyebrow {
      font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;
    }
    .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .scale {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .scale button, .choice button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      min-width: 42px;
      height: 38px;
      padding: 0 12px;
      font: 600 13px/1 var(--mono);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .12s;
    }
    .scale button:hover, .choice button:hover { border-color: var(--accent); }
    .scale button.is-on, .choice button.is-on {
      background: var(--accent-soft);
      border-color: color-mix(in oklab, var(--accent) 40%, var(--line));
      color: var(--accent);
      transform: translateY(-1px);
    }
    textarea {
      width: 100%; min-height: 92px; resize: vertical;
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font: inherit; font-size: 14px;
      background: #fff;
    }
    textarea:focus { outline: 2px solid color-mix(in oklab, var(--accent) 35%, white); border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .submit {
      margin-top: 8px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      min-height: 48px;
      background: var(--accent);
      color: #fff;
      font: 700 14px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .submit:disabled { opacity: .55; cursor: default; }
    .status {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px;
      font-size: 14px; display: none;
    }
    .status.is-error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status.is-ok { display: block; background: #ecfdf5; color: var(--good); border: 1px solid #bbf7d0; }
    .thanks { text-align: center; padding: 28px 8px; }
    .thanks h2 { font-size: 32px; }
    .loading { color: var(--muted); font-size: 15px; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .check input { width: 18px; height: 18px; }
    @media (max-width: 520px) {
      h2 { font-size: 24px; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">UN</div>
      <div>
        <h1>UNALIGNED</h1>
        <p>Partner feedback</p>
      </div>
    </div>
    <div class="card" id="app">
      <p class="loading">Loading your feedback form…</p>
    </div>
  </div>
  <script>
    const API = 'https://us-central1-unaligned-fc556.cloudfunctions.net/collabFeedback';
    const params = new URLSearchParams(location.search);
    const token = (params.get('t') || params.get('token') || '').trim();

    const state = {
      overall_score: null,
      process_score: null,
      robert_score: null,
      communication_score: null,
      nps: null,
      would_again: null,
      went_well: '',
      improve: '',
      public_ok: false,
      testimonial: '',
    };

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      });
      (children || []).forEach((c) => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
      return node;
    }

    function scaleField(key, label, min, max) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label }));
      const row = el('div', { className: 'scale' });
      for (let i = min; i <= max; i += 1) {
        const btn = el('button', { type: 'button', text: String(i) });
        btn.addEventListener('click', () => {
          state[key] = i;
          row.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', Number(b.textContent) === i));
        });
        row.appendChild(btn);
      }
      field.appendChild(row);
      return field;
    }

    function choiceField(key, label, options) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label }));
      const row = el('div', { className: 'choice' });
      options.forEach((opt) => {
        const btn = el('button', { type: 'button', text: opt.label });
        btn.addEventListener('click', () => {
          state[key] = opt.value;
          row.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', b.textContent === opt.label));
        });
        row.appendChild(btn);
      });
      field.appendChild(row);
      return field;
    }

    function renderForm(invite) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { className: 'eyebrow', text: invite.brand || 'Partnership' }));
      app.appendChild(el('h2', { text: `How did we do${invite.contactName ? ', ' + invite.contactName.split(' ')[0] : ''}?` }));
      app.appendChild(el('p', {
        className: 'lead',
        text: 'Two minutes. Your answers go straight to our team and help us tighten the process for the next partner.',
      }));

      const form = el('form');
      form.appendChild(scaleField('overall_score', 'Overall experience', 1, 10));
      form.appendChild(scaleField('process_score', 'How smooth was the process (first contact to post)?', 1, 10));
      form.appendChild(scaleField('robert_score', "Robert's content met our expectations", 1, 10));
      form.appendChild(scaleField('communication_score', 'Communication with the UNALIGNED team', 1, 10));
      form.appendChild(scaleField('nps', 'How likely are you to recommend UNALIGNED? (0 = not at all, 10 = absolutely)', 0, 10));
      form.appendChild(choiceField('would_again', 'Would you work with us again?', [
        { label: 'Yes', value: 'yes' },
        { label: 'Maybe', value: 'maybe' },
        { label: 'No', value: 'no' },
      ]));

      const well = el('div', { className: 'field' });
      well.appendChild(el('label', { text: 'What went well?' }));
      const wellTa = el('textarea', { placeholder: 'Optional but gold for us.' });
      wellTa.addEventListener('input', () => { state.went_well = wellTa.value; });
      well.appendChild(wellTa);
      form.appendChild(well);

      const imp = el('div', { className: 'field' });
      imp.appendChild(el('label', { text: 'What should we improve?' }));
      const impTa = el('textarea', { placeholder: 'Be blunt. We use this to upgrade the system.' });
      impTa.addEventListener('input', () => { state.improve = impTa.value; });
      imp.appendChild(impTa);
      form.appendChild(imp);

      const pub = el('div', { className: 'field check' });
      const pubCb = el('input', { type: 'checkbox' });
      pubCb.addEventListener('change', () => { state.public_ok = pubCb.checked; });
      pub.appendChild(pubCb);
      pub.appendChild(el('span', { text: 'You may use a quote from me publicly (website, deck, etc.)' }));
      form.appendChild(pub);

      const quote = el('div', { className: 'field' });
      quote.appendChild(el('label', { text: 'Optional testimonial quote' }));
      const quoteTa = el('textarea', { placeholder: 'One sentence we can share if you checked the box above.' });
      quoteTa.addEventListener('input', () => { state.testimonial = quoteTa.value; });
      quote.appendChild(quoteTa);
      form.appendChild(quote);

      const status = el('div', { className: 'status', id: 'status' });
      const submit = el('button', { className: 'submit', type: 'submit', text: 'Send feedback' });
      form.appendChild(submit);
      form.appendChild(status);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.className = 'status';
        status.textContent = '';
        submit.disabled = true;
        try {
          const resp = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, answers: state }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) throw new Error(data.error || 'Submit failed');
          renderThanks(invite);
        } catch (err) {
          status.className = 'status is-error';
          status.textContent = err.message || 'Something went wrong. Email asherunaligned@gmail.com and we will fix it.';
          submit.disabled = false;
        }
      });

      app.appendChild(form);
    }

    function renderThanks(invite) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const box = el('div', { className: 'thanks' });
      box.appendChild(el('div', { className: 'eyebrow', text: 'Received' }));
      box.appendChild(el('h2', { text: 'Thank you.' }));
      box.appendChild(el('p', {
        className: 'lead',
        text: 'This goes into how we run the next collaboration. If anything urgent comes up, reply on your existing thread with Asher.',
      }));
      app.appendChild(box);
    }

    function renderError(message) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { className: 'status is-error', text: message }));
    }

    async function boot() {
      if (!token) return renderError('Missing feedback link. Ask your UNALIGNED contact for the full URL.');
      try {
        const resp = await fetch(`${API}?token=${encodeURIComponent(token)}`);
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || 'Could not load feedback form');
        if (data.invite?.status === 'submitted') return renderThanks(data.invite);
        renderForm(data.invite || {});
      } catch (err) {
        renderError(err.message || 'Could not load feedback form');
      }
    }

    boot();
  </script>
</body>
</html>
