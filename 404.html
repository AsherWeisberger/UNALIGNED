<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNALIGNED · Page not found</title>
  <script>
  (function () {
    var host = String(location.hostname || '').toLowerCase();
    var isCustom = host === 'agentdashboard.cloud' || host === 'www.agentdashboard.cloud';
    var path = String(location.pathname || '/').replace(/\/$/, '') || '/';
    var base = /^\/UNALIGNED(\/|$)/i.test(location.pathname || '/') ? '/UNALIGNED' : '';
    if (path === '/connect' || path === '/UNALIGNED/connect') {
      location.replace(base + '/connect/' + location.search + location.hash);
      return;
    }
    if (isCustom) {
      location.replace('/connect/' + location.search + location.hash);
    }
  })();
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 500 15px/1.5 system-ui, sans-serif; color: #12151c;
      background: #f4f1ea; padding: 24px;
    }
    .box {
      max-width: 420px; padding: 22px 20px; border-radius: 14px;
      background: #fff; border: 1px solid #e2ddd3;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 14px; color: #5a6272; }
    a { color: #1f4fd6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>This UNALIGNED link may be outdated or not deployed yet. If you were sent a team form, ask your contact to resend the link.</p>
    <p><a href="https://agentdashboard.cloud/connect">Reach Robert's team</a></p>
  </div>
</body>
</html>
