<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNALIGNED · Scope your collaboration</title>
  <meta name="description" content="Pick your UNALIGNED package, see pricing, and send scope for Robert Scoble's team." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #f3f1eb;
      --card: #fff;
      --text: #12151c;
      --muted: #5c6475;
      --line: #e3dfd5;
      --accent: #1f4fd6;
      --accent-soft: #e8efff;
      --good: #15803d;
      --radius: 16px;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text);
      background:
        radial-gradient(1100px 480px at 0% -5%, #dce8ff 0%, transparent 58%),
        radial-gradient(800px 360px at 100% 0%, #fde8d8 0%, transparent 52%),
        var(--bg);
      padding: 28px 16px 56px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark {
      width: 44px; height: 44px; border-radius: 13px;
      background: linear-gradient(135deg, #1f4fd6, #6d28d9);
      color: #fff; display: grid; place-items: center;
      font: 700 14px/1 var(--mono); letter-spacing: .08em;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; }
    .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-family: var(--sans); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px 22px; box-shadow: 0 20px 44px rgba(18, 21, 28, .07);
    }
    .eyebrow {
      font: 700 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    h2 { margin: 0 0 8px; font-size: 28px; line-height: 1.12; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.55; font-family: var(--sans); }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .step-pill {
      font: 700 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
      padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    }
    .step-pill.is-on { background: var(--accent-soft); color: var(--accent); border-color: #c7d7fb; }
    .tier-grid { display: grid; gap: 10px; margin-bottom: 18px; }
    .tier-card {
      width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; background: #fff; cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .12s;
    }
    .tier-card:hover { border-color: color-mix(in oklab, var(--accent) 35%, var(--line)); }
    .tier-card.is-on {
      border-color: var(--accent); background: var(--accent-soft);
      box-shadow: 0 10px 24px rgba(31, 79, 214, .12); transform: translateY(-1px);
    }
    .tier-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .tier-name { font: 700 16px/1.2 var(--sans); }
    .tier-price { font: 700 18px/1 var(--mono); color: var(--accent); white-space: nowrap; }
    .tier-short {
      display: inline-block; margin-top: 6px; font: 700 10px/1 var(--mono);
      letter-spacing: .1em; color: var(--muted);
    }
    .tier-items { margin: 10px 0 0; padding-left: 18px; font: 500 13px/1.5 var(--sans); color: var(--muted); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font: 600 14px/1.3 var(--sans); margin-bottom: 7px; }
    .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--sans); }
    input[type="text"], input[type="email"], input[type="url"], input[type="date"] {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 13px; font: 500 14px/1.4 var(--sans); background: #fff;
    }
    textarea {
      width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; font: 500 14px/1.45 var(--sans); background: #fff;
    }
    input:focus, textarea:focus {
      outline: 2px solid color-mix(in oklab, var(--accent) 35%, white); border-color: var(--accent);
    }
    .summary {
      border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
      background: color-mix(in srgb, var(--accent-soft) 45%, white);
      margin-bottom: 16px; font-family: var(--sans); font-size: 14px; line-height: 1.5;
    }
    .summary strong { display: block; margin-bottom: 4px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .btn {
      border-radius: 12px; min-height: 44px; padding: 0 16px; font: 700 13px/1 var(--mono);
      letter-spacing: .05em; text-transform: uppercase; cursor: pointer; border: 1px solid var(--line);
      background: #fff;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
    .btn:disabled { opacity: .55; cursor: default; }
    .status {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
      font-family: var(--sans); display: none;
    }
    .status.is-error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status.is-ok { display: block; background: #ecfdf5; color: var(--good); border: 1px solid #bbf7d0; }
    .thanks { text-align: center; padding: 28px 8px; }
    .thanks h2 { font-size: 32px; }
    @media (max-width: 560px) {
      h2 { font-size: 24px; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">UN</div>
      <div>
        <h1>UNALIGNED</h1>
        <p>Collaboration scope</p>
      </div>
    </div>
    <div class="card" id="app"><p class="lead">Loading your scope form…</p></div>
  </div>
  <script>
    const API = 'https://us-central1-unaligned-fc556.cloudfunctions.net/collabScopeIntake';
    const params = new URLSearchParams(location.search);
    const token = (params.get('t') || params.get('token') || '').trim();

    const state = {
      step: 1,
      tier_id: null,
      tier_name: '',
      tier_price: null,
      tier_short: '',
      tier_items: [],
      what_promoting: '',
      narrative_angle: '',
      scope_details: '',
      assets_url: '',
      launch_timing: '',
      must_include: '',
      must_avoid: '',
      additional_notes: '',
    };

    let invite = {};
    let catalog = [];

    function money(n) {
      const v = Number(n);
      return Number.isFinite(v) ? '$' + v.toLocaleString('en-US') : '—';
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      });
      (children || []).forEach((c) => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
      return node;
    }

    function textField(key, label, opts = {}) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label + (opts.required ? ' *' : '') }));
      const input = el('input', { type: opts.type || 'text', placeholder: opts.placeholder || '' });
      input.value = state[key] || '';
      input.addEventListener('input', () => { state[key] = input.value.trim(); });
      field.appendChild(input);
      if (opts.hint) field.appendChild(el('span', { className: 'hint', text: opts.hint }));
      return field;
    }

    function textAreaField(key, label, opts = {}) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label + (opts.required ? ' *' : '') }));
      const ta = el('textarea', { placeholder: opts.placeholder || '' });
      ta.value = state[key] || '';
      ta.addEventListener('input', () => { state[key] = ta.value; });
      field.appendChild(ta);
      if (opts.hint) field.appendChild(el('span', { className: 'hint', text: opts.hint }));
      return field;
    }

    function stepPills() {
      const row = el('div', { className: 'steps' });
      ['Package', 'Scope', 'Send'].forEach((label, i) => {
        row.appendChild(el('span', {
          className: 'step-pill' + (state.step === i + 1 ? ' is-on' : ''),
          text: `${i + 1}. ${label}`,
        }));
      });
      return row;
    }

    function renderTierStep(app) {
      app.appendChild(stepPills());
      app.appendChild(el('div', { className: 'eyebrow', text: invite.brand || 'Collaboration' }));
      app.appendChild(el('h2', { text: `Pick your package${invite.contactName ? ', ' + invite.contactName.split(' ')[0] : ''}` }));
      app.appendChild(el('p', {
        className: 'lead',
        text: 'Choose what you want Robert to deliver. Price is fixed per package — scope below tells us how to execute it.',
      }));

      const grid = el('div', { className: 'tier-grid' });
      catalog.forEach((tier) => {
        const card = el('button', { type: 'button', className: 'tier-card' + (state.tier_id === tier.id ? ' is-on' : '') });
        const top = el('div', { className: 'tier-top' });
        const left = el('div');
        left.appendChild(el('div', { className: 'tier-name', text: tier.name }));
        if (tier.short) left.appendChild(el('span', { className: 'tier-short', text: tier.short }));
        top.appendChild(left);
        top.appendChild(el('div', { className: 'tier-price', text: money(tier.price) }));
        card.appendChild(top);
        if (Array.isArray(tier.items) && tier.items.length) {
          const list = el('ul', { className: 'tier-items' });
          tier.items.forEach((item) => list.appendChild(el('li', { text: item })));
          card.appendChild(list);
        }
        card.addEventListener('click', () => {
          state.tier_id = tier.id;
          state.tier_name = tier.name;
          state.tier_price = tier.price;
          state.tier_short = tier.short || '';
          state.tier_items = tier.items || [];
          grid.querySelectorAll('.tier-card').forEach((node) => node.classList.remove('is-on'));
          card.classList.add('is-on');
        });
        grid.appendChild(card);
      });
      app.appendChild(grid);

      const status = el('div', { className: 'status', id: 'status' });
      const next = el('button', {
        className: 'btn btn-primary',
        type: 'button',
        text: 'Continue to scope',
        onclick: () => {
          if (!state.tier_id) {
            status.className = 'status is-error';
            status.textContent = 'Select a package to continue.';
            return;
          }
          state.step = 2;
          render();
        },
      });
      app.appendChild(el('div', { className: 'row' }, [next]));
      app.appendChild(status);
    }

    function renderScopeStep(app) {
      app.appendChild(stepPills());
      app.appendChild(el('h2', { text: 'Scope of work' }));
      app.appendChild(el('p', {
        className: 'lead',
        text: `You selected ${state.tier_name} (${money(state.tier_price)}). Tell us what we're building so the team can draft without guessing.`,
      }));

      const form = el('form');
      form.appendChild(textAreaField('what_promoting', 'What are we helping you tell?', {
        required: true,
        placeholder: 'Product launch, milestone, narrative, campaign — one clear sentence.',
      }));
      form.appendChild(textAreaField('narrative_angle', 'Angle or hook for Robert', {
        placeholder: 'Optional. The futurist frame, proof point, or story beat you want emphasized.',
      }));
      form.appendChild(textAreaField('scope_details', 'Scope details', {
        required: true,
        placeholder: 'Deliverable specifics: QRT target, thread beats, mentions, @tags, links, disclosure needs, review rounds…',
        hint: 'This becomes the brief. Be specific — especially for quote reposts and narrative threads.',
      }));
      form.appendChild(textField('assets_url', 'Assets link', {
        type: 'url',
        placeholder: 'Google Drive, Figma, press kit, footage…',
      }));
      form.appendChild(textField('launch_timing', 'Target go-live window', {
        placeholder: 'e.g. June 20–22, or "flexible within 2 weeks"',
      }));
      form.appendChild(textAreaField('must_include', 'Must include', {
        placeholder: 'Claims, handles, partner names, legal language…',
      }));
      form.appendChild(textAreaField('must_avoid', 'Must avoid', {
        placeholder: 'Fundraising, competitor names, inaccurate claims…',
      }));
      form.appendChild(textAreaField('additional_notes', 'Anything else', {
        placeholder: 'Optional context for Asher / Sam / Robert.',
      }));

      const status = el('div', { className: 'status', id: 'status' });
      const back = el('button', { className: 'btn', type: 'button', text: 'Back', onclick: () => { state.step = 1; render(); } });
      const next = el('button', { className: 'btn btn-primary', type: 'submit', text: 'Review & send' });
      form.appendChild(el('div', { className: 'row' }, [back, next]));
      form.appendChild(status);

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!state.what_promoting.trim() || state.scope_details.trim().length < 20) {
          status.className = 'status is-error';
          status.textContent = 'Add what you are promoting and at least a few lines of scope detail.';
          return;
        }
        state.step = 3;
        render();
      });

      app.appendChild(form);
    }

    function renderConfirmStep(app) {
      app.appendChild(stepPills());
      app.appendChild(el('h2', { text: 'Confirm & send' }));
      const summary = el('div', { className: 'summary' });
      summary.appendChild(el('strong', { text: `${state.tier_name} · ${money(state.tier_price)}` }));
      const items = (state.tier_items || []).join(' · ');
      if (items) summary.appendChild(el('div', { text: items }));
      summary.appendChild(el('div', { text: state.what_promoting }));
      summary.appendChild(el('div', { text: state.scope_details.slice(0, 280) + (state.scope_details.length > 280 ? '…' : '') }));
      app.appendChild(summary);

      const status = el('div', { className: 'status', id: 'status' });
      const back = el('button', { className: 'btn', type: 'button', text: 'Edit scope', onclick: () => { state.step = 2; render(); } });
      const submit = el('button', { className: 'btn btn-primary', type: 'button', text: 'Send scope to UNALIGNED' });
      submit.addEventListener('click', async () => {
        submit.disabled = true;
        status.className = 'status';
        status.textContent = '';
        const brief_snapshot = {
          tier_id: state.tier_id,
          tier_name: state.tier_name,
          tier_price: state.tier_price,
          tier_short: state.tier_short,
          tier_items: state.tier_items,
          brand: invite.brand || '',
          contact_name: invite.contactName || '',
          contact_email: invite.contactEmail || '',
          what_promoting: state.what_promoting,
          narrative_angle: state.narrative_angle,
          scope_details: state.scope_details,
          assets_url: state.assets_url,
          launch_timing: state.launch_timing,
          must_include: state.must_include,
          must_avoid: state.must_avoid,
          additional_notes: state.additional_notes,
        };
        try {
          const resp = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              answers: {
                tier_id: state.tier_id,
                tier_name: state.tier_name,
                tier_price: state.tier_price,
                tier_short: state.tier_short,
                tier_items: state.tier_items,
                what_promoting: state.what_promoting,
                narrative_angle: state.narrative_angle,
                scope_details: state.scope_details,
                assets_url: state.assets_url,
                launch_timing: state.launch_timing,
                must_include: state.must_include,
                must_avoid: state.must_avoid,
                additional_notes: state.additional_notes,
                brief_snapshot,
              },
            }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) throw new Error(data.error || 'Submit failed');
          renderThanks();
        } catch (err) {
          status.className = 'status is-error';
          status.textContent = err.message || 'Something went wrong. Email asherunaligned@gmail.com.';
          submit.disabled = false;
        }
      });
      app.appendChild(el('div', { className: 'row' }, [back, submit]));
      app.appendChild(status);
    }

    function renderThanks() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const box = el('div', { className: 'thanks' });
      box.appendChild(el('div', { className: 'eyebrow', text: 'Received' }));
      box.appendChild(el('h2', { text: 'Scope received.' }));
      box.appendChild(el('p', {
        className: 'lead',
        text: `We have your ${state.tier_name} package (${money(state.tier_price)}) and scope. The team will follow up on your thread to confirm and move to brief.`,
      }));
      app.appendChild(box);
    }

    function renderError(message) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { className: 'status is-error', text: message }));
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      if (state.step === 1) renderTierStep(app);
      else if (state.step === 2) renderScopeStep(app);
      else renderConfirmStep(app);
    }

    async function boot() {
      if (!token) return renderError('Missing scope link. Ask your UNALIGNED contact for the full URL.');
      try {
        const resp = await fetch(`${API}?token=${encodeURIComponent(token)}`);
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || 'Could not load scope form');
        if (data.invite?.status === 'submitted') {
          state.tier_name = data.invite.tierName || 'package';
          state.tier_price = data.invite.tierPrice;
          return renderThanks();
        }
        invite = data.invite || {};
        catalog = Array.isArray(data.catalog) ? data.catalog : [];
        if (!catalog.length) throw new Error('Pricing catalog unavailable. Try again shortly.');
        render();
      } catch (err) {
        renderError(err.message || 'Could not load scope form');
      }
    }

    boot();
  </script>
</body>
</html>
