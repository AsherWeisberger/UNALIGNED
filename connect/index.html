<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="canonical" href="https://agentdashboard.cloud/connect" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UNALIGNED · Reach Robert's team</title>
  <!-- form build: 20260817-idle-wander-v3 -->
  <meta name="description" content="Share your idea with Robert Scoble's team. We read everything and route the best fits to Robert's desk." />
  <meta name="theme-color" content="#0D0F14" />
  <meta name="color-scheme" content="dark" />
  <!-- Open Graph / X card — static meta first; crawlers do not run JS -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="UNALIGNED" />
  <meta property="og:url" content="https://agentdashboard.cloud/connect" />
  <meta property="og:title" content="UNALIGNED" />
  <meta property="og:description" content="Reach Robert's team" />
  <meta property="og:image" content="https://agentdashboard.cloud/assets/unaligned-og-connect.jpg" />
  <meta property="og:image:secure_url" content="https://agentdashboard.cloud/assets/unaligned-og-connect.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="UNALIGNED — Reach Robert's team" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Scobleizer" />
  <meta name="twitter:domain" content="agentdashboard.cloud" />
  <meta name="twitter:url" content="https://agentdashboard.cloud/connect" />
  <meta name="twitter:title" content="UNALIGNED" />
  <meta name="twitter:description" content="Reach Robert's team" />
  <meta name="twitter:image" content="https://agentdashboard.cloud/assets/unaligned-og-connect.jpg" />
  <meta name="twitter:image:alt" content="UNALIGNED — Reach Robert's team" />
  <script>
  // Ops dashboard hosts must not be the shareable link — send visitors to the public form.
  (function () {
    var host = String(location.hostname || '');
    var publicUrl = 'https://agentdashboard.cloud/connect';
    if (host.indexOf('mac-studio.tail') >= 0) {
      var target = publicUrl + String(location.search || '') + String(location.hash || '');
      var here = location.href.split('?')[0].split('#')[0].replace(/\/$/, '');
      if (here !== publicUrl && here !== publicUrl + '/') location.replace(target);
    }
  })();
  </script>
  <link rel="icon" href="../favicon.ico" />
  <link rel="stylesheet" href="../assets/unaligned-form.css?v=20260817-idle-wander-v3" />
</head>
<body class="ua-form-page ua-form-connect">
  <div class="ua-scene">
    <canvas class="ua-reactive-grid" aria-hidden="true"></canvas>
    <div class="ua-grain" aria-hidden="true"></div>
    <div class="ua-vignette" aria-hidden="true"></div>
    <div class="ua-wrap">
      <header class="ua-hero">
        <div class="ua-logo-frame">
          <img src="../assets/unaligned-form-logo.png" alt="UNALIGNED" class="ua-logo" width="800" height="199" />
          <div class="ua-logo-glow" aria-hidden="true"></div>
        </div>
        <p class="ua-tagline">Robert Scoble · team intake</p>
      </header>
      <div class="ua-card" id="app">
        <p class="lead">Loading…</p>
      </div>
      <p class="ua-foot">Every note is read by the UNALIGNED team. Strong fits get a direct line to Robert's desk.<span class="ua-credit">A custom app by Asher Weisberger</span></p>
    </div>
  </div>
  <script src="../assets/reactive-grid.js?v=20260817-idle-wander-v3"></script>
  <script>
    const API = 'https://us-central1-unaligned-fc556.cloudfunctions.net/robertDeskIntake';

    // Lane order matters: General Conversation is first and the default selection
    // so partnership pricing only appears when they deliberately choose Collaboration.
    const LANES = [
      {
        label: 'General Conversation',
        value: 'general_outreach',
        lead: 'Partnerships, intros, syncs, and anything else worth routing to Robert\'s desk.',
        messageHint: 'What you want to explore, why now, and how Robert fits in.',
        briefHint: 'Optional — link to a deck, site, or doc if it helps.',
      },
      {
        label: 'Collaboration',
        value: 'collaboration',
        lead: 'Paid collabs, sponsorships, brand deals, and project ideas with Robert.',
        messageHint: 'What are you proposing, what deliverable do you want, and any timing or budget context.',
        briefHint: 'Optional but helpful — deck, brief, or one-pager for the collab.',
      },
    ];

    // Live rate card (matches pricing_tiers / package PDF + X List Placement from rate card).
    // Plain text only — no images. Shown only on the Collaboration lane.
    const RATE_CARD = {
      note: 'All packages are USD and paid in full before any content goes live. Existing clients may be invoiced on go-live day. Every paid post carries a clear paid partnership disclosure.',
      packages: [
        { name: 'Retweet', price: 1295, items: ['1 retweet'] },
        { name: 'Quote Repost', price: 2195, items: ['1 quote repost', "Robert's original quote (up to 3 sentences)"] },
        { name: 'Custom X Post', price: 2495, items: ['1 custom-written X post'] },
        { name: 'Narrative Thread', price: 2995, items: ['1 thread (main post + 2 attached replies)'] },
        { name: 'Content Core', price: 3495, items: ['1 custom X post', '1 LinkedIn post', 'Newsletter feature'] },
        { name: 'Growth Bundle', price: 4495, items: ['1 custom X post', '1 LinkedIn post', '1 retweet', 'Newsletter feature'] },
        { name: 'Maximum Impact', price: 6495, items: ['2 custom X posts', '1 LinkedIn post', '2 retweets', 'Newsletter feature', 'Strategy sync'] },
        { name: 'Founder Video Post', price: 4495, items: ['1 native X video, Robert on camera reacting to or demoing the product (up to ~90s)', 'One round of edits', 'Client provides product access and brief'] },
        { name: 'X Space (Live)', price: 4995, items: ['1 hosted or co-hosted live X Space with the founder, 30 to 45 min', 'Scheduled slot, promoted beforehand', 'Recording clipped for reuse after'] },
      ],
      addon: {
        name: "Robert's Team Demo & Media",
        price: 500,
        items: [
          "Robert's team produces demo clips and screen media for the post",
          '$500 per post produced — available as an add-on on any package',
          'Without the add-on, the client supplies links for all media',
        ],
      },
      listPlacement: {
        eyebrow: 'X List Placement',
        subtitle: 'Your brand sits at the top of Robert curated X lists. Not a feed post.',
        note: 'Examples: AI Companies, AI Community, Founders. Client supplies logo, one line blurb, and profile URL. Paid Partnership disclosure. Paid in full before go live.',
        packages: [
          { name: 'List Placement', price: 1995, items: ['7 days, 1 list'] },
          { name: 'List Pack', price: 3495, items: ['7 days, up to 3 lists'] },
          { name: 'List Residency', price: 5995, items: ['30 days, 1 flagship list'] },
        ],
      },
    };

    const CONTACT_PREFS = [
      { label: 'Email', value: 'email' },
      { label: 'X / Twitter', value: 'x' },
      { label: 'WhatsApp', value: 'whatsapp' },
      { label: 'Signal', value: 'signal' },
      { label: 'Phone / text', value: 'phone' },
      { label: 'Other', value: 'other' },
    ];

    const CONTACT_FIELDS = {
      email: {
        label: 'Email address',
        type: 'email',
        placeholder: 'you@company.com',
        hint: 'This is the address we\'ll use first.',
        autocomplete: 'email',
      },
      x: {
        label: 'X handle',
        type: 'text',
        placeholder: '@handle',
        hint: 'Your public handle so we can find you fast.',
        autocomplete: 'off',
      },
      whatsapp: {
        label: 'WhatsApp number',
        type: 'tel',
        placeholder: '+1 555 123 4567',
        hint: 'Include country code.',
        autocomplete: 'tel',
      },
      signal: {
        label: 'Signal number',
        type: 'tel',
        placeholder: '+1 555 123 4567',
        hint: 'Include country code.',
        autocomplete: 'tel',
      },
      phone: {
        label: 'Phone number',
        type: 'tel',
        placeholder: '+1 555 123 4567',
        hint: 'For call or text.',
        autocomplete: 'tel',
      },
      other: {
        label: 'How should we reach you?',
        type: 'text',
        placeholder: 'Telegram @you, LinkedIn, Discord…',
        hint: 'Any channel works — tell us where and how to find you.',
        autocomplete: 'off',
      },
    };

    const state = {
      company: '',
      first_name: '',
      last_name: '',
      email: '',
      contact_detail: '',
      contact_preference: '',
      // Default: general conversation so rates are not in their face on load.
      intake_lane: 'general_outreach',
      topic_type: 'general_outreach',
      brief_link: '',
      message: '',
      company_website: '',
    };

    let contactDetailInput = null;
    let backupEmailWrap = null;
    let contactPanel = null;
    let laneLeadEl = null;
    let messageHintEl = null;
    let briefHintEl = null;
    let briefFieldWrap = null;
    let ratesPanelEl = null;

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (v == null || v === false) return;
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'hidden' && v) node.hidden = true;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      });
      (children || []).forEach((c) => node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
      return node;
    }

    function textField(key, label, opts = {}) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label + (opts.required ? ' *' : '') }));
      const input = el('input', {
        type: opts.type || 'text',
        placeholder: opts.placeholder || '',
        autocomplete: opts.autocomplete || 'off',
      });
      input.addEventListener('input', () => { state[key] = input.value.trim(); });
      field.appendChild(input);
      if (opts.hint) field.appendChild(el('span', { className: 'hint', text: opts.hint }));
      return field;
    }

    function choiceField(key, label, options, onPick) {
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: label + ' *' }));
      const row = el('div', { className: 'choice' });
      options.forEach((opt) => {
        const btn = el('button', { type: 'button', text: opt.label });
        btn.addEventListener('click', () => {
          state[key] = opt.value;
          row.querySelectorAll('button').forEach((b) => b.classList.toggle('is-on', b.textContent === opt.label));
          if (typeof onPick === 'function') onPick(opt.value);
        });
        row.appendChild(btn);
      });
      field.appendChild(row);
      return field;
    }

    function syncContactDetailField(pref) {
      if (!contactPanel || !contactDetailInput) return;
      const config = CONTACT_FIELDS[pref];
      if (!config) {
        contactPanel.classList.remove('is-open');
        return;
      }
      contactPanel.classList.add('is-open');
      const label = contactPanel.querySelector('label');
      if (label) label.textContent = config.label + ' *';
      contactDetailInput.type = config.type;
      contactDetailInput.placeholder = config.placeholder;
      contactDetailInput.autocomplete = config.autocomplete || 'off';
      const hint = contactPanel.querySelector('.hint');
      if (hint) hint.textContent = config.hint;
      if (backupEmailWrap) {
        backupEmailWrap.style.display = pref === 'email' ? 'none' : '';
      }
      window.requestAnimationFrame(() => contactDetailInput.focus());
    }

    function contactDetailField() {
      const panel = el('div', { className: 'contact-panel' });
      const field = el('div', { className: 'field' });
      field.appendChild(el('label', { text: 'Contact details *' }));
      const input = el('input', {
        type: 'text',
        placeholder: '',
        autocomplete: 'off',
      });
      input.addEventListener('input', () => {
        state.contact_detail = input.value.trim();
        if (state.contact_preference === 'email') state.email = state.contact_detail;
      });
      field.appendChild(input);
      field.appendChild(el('span', { className: 'hint', text: '' }));
      panel.appendChild(field);
      contactPanel = panel;
      contactDetailInput = input;
      return panel;
    }

    function laneConfig(value) {
      return LANES.find((lane) => lane.value === value) || LANES[0];
    }

    function money(n) {
      const num = Number(n);
      if (!Number.isFinite(num)) return '';
      return '$' + num.toLocaleString('en-US');
    }

    function ratesPanel() {
      const panel = el('div', {
        className: 'rates-panel',
        id: 'collab-rates',
        hidden: state.intake_lane !== 'collaboration',
        'aria-label': 'Partnership pricing',
      });

      panel.appendChild(el('div', { className: 'rates-eyebrow', text: 'Partnership packages' }));
      panel.appendChild(el('p', {
        className: 'rates-intro',
        text: RATE_CARD.note,
      }));

      const list = el('ul', { className: 'rates-list' });
      RATE_CARD.packages.forEach((pkg) => {
        const li = el('li', { className: 'rates-item' });
        li.appendChild(el('div', {
          className: 'rates-item-title',
          text: pkg.name + ' — ' + money(pkg.price),
        }));
        const bullets = el('ul', { className: 'rates-item-bullets' });
        (pkg.items || []).forEach((line) => {
          bullets.appendChild(el('li', { text: line }));
        });
        li.appendChild(bullets);
        list.appendChild(li);
      });
      panel.appendChild(list);

      if (RATE_CARD.addon) {
        const add = el('div', { className: 'rates-addon' });
        add.appendChild(el('div', {
          className: 'rates-item-title',
          text: 'Add-on · ' + RATE_CARD.addon.name + ' — ' + money(RATE_CARD.addon.price),
        }));
        const bullets = el('ul', { className: 'rates-item-bullets' });
        (RATE_CARD.addon.items || []).forEach((line) => {
          bullets.appendChild(el('li', { text: line }));
        });
        add.appendChild(bullets);
        panel.appendChild(add);
      }

      if (RATE_CARD.listPlacement) {
        const lp = RATE_CARD.listPlacement;
        panel.appendChild(el('div', { className: 'rates-eyebrow rates-eyebrow-list', text: lp.eyebrow }));
        if (lp.subtitle) {
          panel.appendChild(el('p', { className: 'rates-intro', text: lp.subtitle }));
        }
        const list2 = el('ul', { className: 'rates-list' });
        (lp.packages || []).forEach((pkg) => {
          const li = el('li', { className: 'rates-item' });
          li.appendChild(el('div', {
            className: 'rates-item-title',
            text: pkg.name + ' — ' + money(pkg.price),
          }));
          const bullets = el('ul', { className: 'rates-item-bullets' });
          (pkg.items || []).forEach((line) => {
            bullets.appendChild(el('li', { text: line }));
          });
          li.appendChild(bullets);
          list2.appendChild(li);
        });
        panel.appendChild(list2);
        if (lp.note) {
          panel.appendChild(el('p', { className: 'rates-intro', text: lp.note }));
        }
      }

      ratesPanelEl = panel;
      return panel;
    }

    function syncRatesVisibility() {
      if (!ratesPanelEl) return;
      ratesPanelEl.hidden = state.intake_lane !== 'collaboration';
    }

    function applyLane(value) {
      const lane = laneConfig(value);
      state.intake_lane = lane.value;
      state.topic_type = lane.value;
      if (laneLeadEl) laneLeadEl.textContent = lane.lead;
      if (messageHintEl) messageHintEl.textContent = lane.messageHint;
      if (briefHintEl) briefHintEl.textContent = lane.briefHint;
      syncRatesVisibility();
    }

    function laneTabs() {
      const wrap = el('div', { className: 'lane-tabs', role: 'tablist', 'aria-label': 'Intake type' });
      LANES.forEach((lane) => {
        const btn = el('button', {
          type: 'button',
          className: 'lane-tab' + (state.intake_lane === lane.value ? ' is-on' : ''),
          text: lane.label,
          role: 'tab',
          'aria-selected': state.intake_lane === lane.value ? 'true' : 'false',
        });
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.lane-tab').forEach((b) => {
            const on = b.textContent === lane.label;
            b.classList.toggle('is-on', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          applyLane(lane.value);
        });
        wrap.appendChild(btn);
      });
      return wrap;
    }

    function renderForm() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(el('div', { className: 'eyebrow', text: "Robert's desk" }));
      app.appendChild(el('h2', { text: "Reach Robert's team" }));
      app.appendChild(laneTabs());
      laneLeadEl = el('p', { className: 'lead', text: laneConfig(state.intake_lane).lead });
      app.appendChild(laneLeadEl);
      app.appendChild(ratesPanel());
      app.appendChild(el('p', {
        className: 'promise',
        text: "This isn't a sales form. It's a direct line to the people who work with Robert every day.",
      }));

      const form = el('form');
      form.appendChild(textField('company', 'Company', {
        placeholder: 'Unaligned',
        autocomplete: 'organization',
        hint: 'Optional if you\'re reaching out solo.',
      }));

      const nameRow = el('div', { className: 'grid-2' });
      nameRow.appendChild(textField('first_name', 'First name', { required: true, placeholder: 'Jane', autocomplete: 'given-name' }));
      nameRow.appendChild(textField('last_name', 'Last name', { required: true, placeholder: 'Doe', autocomplete: 'family-name' }));
      form.appendChild(nameRow);

      form.appendChild(choiceField('contact_preference', 'Best way to reach you', CONTACT_PREFS, syncContactDetailField));
      form.appendChild(contactDetailField());

      const backupEmail = textField('email', 'Backup email', {
        type: 'email',
        required: true,
        placeholder: 'you@company.com',
        autocomplete: 'email',
        hint: 'In case we can\'t reach you on your preferred channel.',
      });
      backupEmailWrap = backupEmail;
      form.appendChild(backupEmail);

      briefFieldWrap = el('div', { className: 'field' });
      briefFieldWrap.appendChild(el('label', { text: 'Brief link' }));
      const briefInput = el('input', {
        type: 'url',
        placeholder: 'https://notion.so/… or docs.google.com/…',
        autocomplete: 'off',
      });
      briefInput.addEventListener('input', () => { state.brief_link = briefInput.value.trim(); });
      briefFieldWrap.appendChild(briefInput);
      briefHintEl = el('span', { className: 'hint', text: laneConfig(state.intake_lane).briefHint });
      briefFieldWrap.appendChild(briefHintEl);
      form.appendChild(briefFieldWrap);

      const msg = el('div', { className: 'field' });
      msg.appendChild(el('label', { text: 'Tell us a bit more *' }));
      const msgTa = el('textarea', { placeholder: 'What are you building, proposing, or excited about? A few sentences is plenty.' });
      msgTa.addEventListener('input', () => { state.message = msgTa.value; });
      msg.appendChild(msgTa);
      messageHintEl = el('span', { className: 'hint', text: laneConfig(state.intake_lane).messageHint });
      msg.appendChild(messageHintEl);
      form.appendChild(msg);

      const hp = el('div', { className: 'hp' });
      const hpInput = el('input', { type: 'text', name: 'company_website', tabindex: '-1', autocomplete: 'off' });
      hpInput.addEventListener('input', () => { state.company_website = hpInput.value; });
      hp.appendChild(hpInput);
      form.appendChild(hp);

      const status = el('div', { className: 'status', id: 'status' });
      const submit = el('button', { className: 'submit', type: 'submit', text: 'Send to the team' });
      form.appendChild(submit);
      form.appendChild(status);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.className = 'status';
        status.textContent = '';
        submit.disabled = true;
        try {
          if (state.brief_link && !/^https?:\/\/.+/i.test(state.brief_link)) {
            throw new Error('Brief link must start with http:// or https://');
          }
          const payload = {
            company: state.company,
            first_name: state.first_name,
            last_name: state.last_name,
            name: [state.first_name, state.last_name].filter(Boolean).join(' ').trim(),
            email: state.contact_preference === 'email' ? state.contact_detail : state.email,
            contact_preference: state.contact_preference,
            contact_detail: state.contact_detail,
            intake_lane: state.intake_lane,
            topic_type: state.topic_type,
            brief_link: state.brief_link,
            message: state.message,
            company_website: state.company_website,
            referrer: document.referrer || '',
            source: 'connect_form',
          };
          if (state.contact_preference === 'x') payload.x_handle = state.contact_detail;
          if (['whatsapp', 'signal', 'phone'].includes(state.contact_preference)) {
            payload.whatsapp = state.contact_detail;
          }
          const resp = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) throw new Error(data.error || 'Submit failed');
          renderThanks();
        } catch (err) {
          status.className = 'status is-error';
          status.textContent = err.message || 'Something went wrong. Try again or email asherunaligned@gmail.com.';
          submit.disabled = false;
        }
      });

      app.appendChild(form);
    }

    function renderThanks() {
      const app = document.getElementById('app');
      app.innerHTML = '';
      const box = el('div', { className: 'thanks' });
      box.appendChild(el('div', { className: 'eyebrow', text: 'Received' }));
      box.appendChild(el('h2', { text: 'Got it.' }));
      box.appendChild(el('p', {
        className: 'lead',
        text: "The team will read this and reach out on your preferred channel if it's a fit. Thanks for taking the time.",
      }));
      app.appendChild(box);
    }

    async function boot() {
      try {
        const resp = await fetch(API, { method: 'GET' });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || 'Form unavailable');
        renderForm();
      } catch (err) {
        renderForm();
      }
    }

    boot();
  </script>
</body>
</html>
